name: Bekreft CSR uten moduler
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy dev"]
    types: [completed]
jobs:
  bekreft:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: verify.yml
    with:
      path: /csr-direkte
      spec: tests/csr-direkte.spec.ts
    secrets: inherit
