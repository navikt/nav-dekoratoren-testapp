name: Deploy prod

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to deploy or roll back to
        required: true
        type: string

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-environment.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
      environment_name: prod
      cluster: prod-gcp
      manifest_path: .nais/nais-prod.yaml
      decorator_environment: prod
      require_tag: true
    secrets: inherit
