apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: nav-dekoratoren-testapp
  namespace: personbruker
  labels:
    "team": personbruker
spec:
  port: 3000
  ingresses:
    - https://nav-dekoratoren-testapp.ekstern.dev.nav.no
  liveness:
    path: /api/ready
    port: 3000
    initialDelay: 5
  readiness:
    path: /api/ready
    port: 3000
    initialDelay: 5
  replicas:
    min: 1
    max: 1
  resources:
    requests:
      cpu: 15m
      memory: 256Mi
  accessPolicy:
    outbound:
      # NB: nav-dekoratoren kjører i namespace/team "personbruker" i dag.
      # Når nav-dekoratoren migreres til "navno", må namespace og
      # application-navn her oppdateres tilsvarende, ellers vil
      # service discovery feile selv om Dekoratøren fungerer som normalt.
      rules:
        - application: nav-dekoratoren
          namespace: personbruker
