apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: nav-dekoratoren-testapp
  namespace: navno
  labels:
    "team": navno
spec:
  image: {{image}}
  port: 3000
  ingresses:
    {{#each ingresses}}
    - {{this}}
    {{/each}}
  liveness:
    path: /api/ready
    port: 3000
    initialDelay: 5
  readiness:
    path: /api/ready
    port: 3000
    initialDelay: 5
  replicas:
    min: 1
    max: 1
  resources:
    requests:
      cpu: 15m
      memory: 256Mi
  accessPolicy:
    outbound:
      rules:
        - application: nav-dekoratoren
          namespace: personbruker
