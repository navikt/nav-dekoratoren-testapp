apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: nav-dekoratoren-testapp
  namespace: personbruker
  labels:
    "team": personbruker
spec:
  port: 3000
  ingresses:
    - https://nav-dekoratoren-testapp.ansatt.nav.no
  env:
    - name: DECORATOR_ENV
      value: prod
  liveness:
    path: /api/ready
    port: 3000
    initialDelay: 5
  readiness:
    path: /api/ready
    port: 3000
    initialDelay: 5
  replicas:
    min: 1
    max: 1
  resources:
    requests:
      cpu: 15m
      memory: 256Mi
  accessPolicy:
    outbound:
      rules:
        - application: nav-dekoratoren
          namespace: personbruker
